# Deploy no servidor — baixa imagens do Docker Hub (sem build)
#
# 1. Copie este arquivo + .env para o servidor
# 2. docker login
# 3. docker compose -f docker-compose.prod.yml pull
# 4. docker compose -f docker-compose.prod.yml up -d
#
# Atualizar versão (obrigatório: frontend + api):
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --force-recreate

services:
  vox-script-salux:
    image: ${DOCKERHUB_USER}/vox-script-salux:${IMAGE_TAG:-latest}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USER}/vox-script-salux-api:${IMAGE_TAG:-latest}
    environment:
      SQLITE_DB_PATH: /data/vox-script-salux.sqlite
      ORACLE_USER: ${ORACLE_EXTERNAL_USER:-}
      ORACLE_PASSWORD: ${ORACLE_EXTERNAL_PASSWORD:-}
      ORACLE_CONNECTION_MODE: ${ORACLE_EXTERNAL_CONNECTION_MODE:-}
      ORACLE_CONNECT_STRING: ${ORACLE_EXTERNAL_CONNECT_STRING:-}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
      MASTER_USERNAME: ${MASTER_USERNAME:-master}
      MASTER_PASSWORD: ${MASTER_PASSWORD:?Defina MASTER_PASSWORD no arquivo .env}
    volumes:
      - vox-script-salux-data:/data
    restart: unless-stopped

volumes:
  vox-script-salux-data:
